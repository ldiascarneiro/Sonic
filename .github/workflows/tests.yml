name: Testes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest
      - run: node --test tests/runner.test.mjs tests/audio.test.mjs
      - name: Validar imagem de produção
        run: docker build -f deploy/Dockerfile -t sonic-ci .
